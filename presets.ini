# Design presets for the resume pipeline.
#
# Values are DXA -- twentieths of a point -- unless noted. 1440 DXA = 1 inch.
# [DEFAULT] is the base design; every other section inherits from it and
# overrides only what it changes, so a preset is usually two or three lines.
#
#   ./build.sh --preset roomy resume.md Resume_Roomy.docx
#
# Add your own by copying a section and renaming it. Any key from [DEFAULT]
# can be overridden. An environment variable of the same name in caps still
# wins over the file, for one-off experiments:
#
#   SPACING=2.0 ./build.sh --preset roomy

[DEFAULT]
body_font    = Calibri
display_font = Arial
body_size    = 21       # half-points, so 21 = 10.5pt
page_width   = 12240    # US Letter
page_height  = 15840
margin       = 720      # 0.5in
spacing      = 1.0      # multiplier on every paragraph before/after gap
line         = 252      # line height in 240ths; 240 = single, 252 = 1.05
bullet_right = 1440     # how far bullet text stops short of the right margin

# Looser vertical rhythm. Easier on the eye, runs longer.
[roomy]
spacing = 1.75
line    = 276

# Tighter, for fitting more onto the page.
[compact]
spacing      = 0.8
line         = 240
bullet_right = 720

# Squeeze: smaller type and narrower margins as well as tighter spacing.
[onepage]
body_size    = 20
margin       = 576      # 0.4in
spacing      = 0.7
line         = 240
bullet_right = 720
